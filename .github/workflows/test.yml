name: Test
on: [push, pull_request]
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gcc -std=c11 -Wall -Wextra -pedantic c/basics.c -o /tmp/atlas-c-basics
      - run: /tmp/atlas-c-basics
      - run: g++ -std=c++17 -Wall -Wextra -pedantic cpp/core.cpp -o /tmp/atlas-core
      - run: /tmp/atlas-core
